name = "forge-cms-tiny-project"
# Not deployed by CI — this app is a readiness fixture (spec 055), never `pnpm deploy:*`'d. This
# file exists only so `wrangler pages dev` can serve a real local D1/R2-backed preview during manual
# verification, matching the same convention every other app in this repo uses.
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist/analog/public"

# The Cloudflare durable profile (spec 084) needs BOTH bindings: `DB` (D1) and `BUCKET` (R2). A production build
# with only one of them — or with neither — refuses to start (src/server/api/profile.ts); it never falls back
# to in-memory. Not created in any real Cloudflare account: local `wrangler pages dev` provisions a local D1
# and a local R2 bucket automatically from these binding names.
[[d1_databases]]
binding = "DB"
database_name = "forge-cms-tiny-project"
database_id = "00000000-0000-0000-0000-000000000001"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "forge-cms-tiny-project"

# SSR (spec 078): where the server render reaches this app's own `/api/*` routes — `wrangler pages dev`'s
# default address. A production render without it fails instead of guessing from the Host header.
[vars]
FORGE_SSR_ORIGIN = "http://127.0.0.1:8788"
