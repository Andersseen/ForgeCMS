<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('forgecms-theme');
        } catch {}
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>ForgeCMS — the Angular-native headless CMS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Define content in TypeScript, call it through a Local API, and mount a reusable Angular admin with ForgeCMS."
    />
    <link rel="canonical" href="https://forge-cms.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ForgeCMS" />
    <meta property="og:title" content="ForgeCMS — the Angular-native headless CMS" />
    <meta
      property="og:description"
      content="Define content in TypeScript, call it through a Local API, and mount a reusable Angular admin with ForgeCMS."
    />
    <meta property="og:url" content="https://forge-cms.pages.dev/" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0A0F1A" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <forge-cms-root></forge-cms-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
