<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('forgecms-theme');
        } catch {}
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>ForgeCMS — the Angular-native headless CMS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="ForgeCMS is the Angular-native, TypeScript code-first headless CMS. Model content in code, use the Local API, and give editors a reusable Angular admin. Stable 1.0.0."
    />
    <link rel="canonical" href="%SITE_ORIGIN%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ForgeCMS" />
    <meta property="og:title" content="ForgeCMS — the Angular-native headless CMS" />
    <meta
      property="og:description"
      content="ForgeCMS is the Angular-native, TypeScript code-first headless CMS. Model content in code, use the Local API, and give editors a reusable Angular admin. Stable 1.0.0."
    />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/social-card.png" />
    <meta property="og:image:alt" content="ForgeCMS — TypeScript content modeling for Angular" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ForgeCMS — the Angular-native headless CMS" />
    <meta
      name="twitter:description"
      content="Stable 1.0.0. Model content in TypeScript, use the Local API, and give editors a reusable Angular admin."
    />
    <meta name="twitter:image" content="%SITE_ORIGIN%/social-card.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "name": "ForgeCMS", "url": "%SITE_ORIGIN%/" },
          {
            "@type": "SoftwareSourceCode",
            "name": "ForgeCMS",
            "description": "An Angular-native, TypeScript code-first headless CMS.",
            "codeRepository": "https://github.com/Andersseen/ForgeCMS",
            "programmingLanguage": "TypeScript",
            "license": "https://opensource.org/license/mit",
            "softwareVersion": "1.0.0",
            "url": "%SITE_ORIGIN%/"
          }
        ]
      }
    </script>
    <meta name="theme-color" content="#0A0F1A" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <forge-cms-root></forge-cms-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
