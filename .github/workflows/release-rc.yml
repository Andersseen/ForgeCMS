# Manual release-candidate publication (spec 092). workflow_dispatch ONLY: never push/PR/merge triggered.
# Publishes an already-prepared `1.0.0-rc.N` commit under the fixed `rc` dist-tag and verifies npm `latest`
# did not move (a package never published before, e.g. a new one, may legitimately have no `latest`;
# the pre/post registry snapshot is passed through $RUNNER_TEMP, spec 095). It does not deploy any
# website. Re-running after a partial publish only publishes the packages still missing from npm (scripts/publish-unpublished.mjs skips existing versions, never overwrites).
#
# Recovery (`mode: finalize`, workflow 38883295228): when publication succeeded but the POST check or the GitHub
# prerelease did not complete (npm registry propagation), finalize NEVER publishes. It checks out the original
# candidate SHA (package contents, GitHub tag target) and runs the CURRENT tooling from the dispatched ref
# against it: bounded wait for the registry, verification that no `rc` is wrong and no stable `latest` moved,
# then the idempotent prerelease. npm assigns `latest` to a package's first version whatever `--tag` says and the
# registry refuses to remove it (run 38957899976: 403 from the CI token, 400 for the maintainer). Neither mode
# mutates any tag; `accept_first_publication_latest: true` (default false) tolerates exactly that `latest` on a
# first-published package, never on a pre-existing one.
name: Release candidate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact commit SHA of the certified candidate (full 40 chars)'
        required: true
        type: string
      version:
        description: 'Expected candidate version, e.g. 1.0.0-rc.0'
        required: true
        type: string
      mode:
        description: 'publish (default), or finalize = verify + GitHub prerelease for an already-published candidate (never publishes)'
        required: false
        default: publish
        type: choice
        options: [publish, finalize]
      accept_first_publication_latest:
        description: 'Tolerate the `latest` tag npm auto-assigned to a first-published package (only when it equals the candidate; nothing is removed)'
        required: false
        default: false
        type: boolean
      baseline:
        description: 'finalize only: the stable npm latest of the pre-existing packages, e.g. 0.13.4'
        required: false
        type: string
      first_publication:
        description: 'finalize only: comma-separated packages first published by the candidate run, e.g. @forge-cms/agent'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: release-rc
  cancel-in-progress: false

jobs:
  publish-rc:
    name: Publish release candidate to npm (tag rc)
    if: inputs.mode != 'finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - name: Verify the checkout is the requested SHA and is clean
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test -z "$(git status --porcelain)"

      - name: Require green CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ inputs.sha }}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
          if [ "$conclusion" -lt 1 ]; then
            echo "No successful CI run for ${{ inputs.sha }}; refusing to publish." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify candidate identity and snapshot npm registry state (pre)
        run: node scripts/release-rc-verify.mjs --phase pre "${{ inputs.version }}" --snapshot "$RUNNER_TEMP/forge-rc-pre.json"

      - name: Build all packages
        run: pnpm build

      - name: Verify packed package installation
        run: pnpm release:verify

      - name: Publish missing packages under tag rc
        run: pnpm release:publish-unpublished --tag rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Verify rc tags and that no npm latest moved (post)
        run: |
          flag=""
          if [ "${{ inputs.accept_first_publication_latest }}" = "true" ]; then flag="--accept-first-publication-latest"; fi
          node scripts/release-rc-verify.mjs --phase post "${{ inputs.version }}" --snapshot "$RUNNER_TEMP/forge-rc-pre.json" $flag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub prerelease
        run: pnpm release:github --mode prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ inputs.sha }}

  finalize-rc:
    name: Finalize an already-published candidate (verify + GitHub prerelease, never publishes)
    if: inputs.mode == 'finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact candidate commit (package contents and release tag target)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          path: candidate

      - name: Checkout the recovery tooling (the dispatched ref)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: tooling

      - name: Verify the candidate checkout is the requested SHA and is clean
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test -z "$(git status --porcelain)"

      - name: Require green CI on the candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ inputs.sha }}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
          if [ "$conclusion" -lt 1 ]; then
            echo "No successful CI run for ${{ inputs.sha }}; refusing to finalize." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'tooling/.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify the published family (bounded wait for the registry)
        working-directory: candidate
        run: |
          flag=""
          if [ "${{ inputs.accept_first_publication_latest }}" = "true" ]; then flag="--accept-first-publication-latest"; fi
          node ../tooling/scripts/release-rc-verify.mjs --phase finalize "${{ inputs.version }}" \
            --baseline "${{ inputs.baseline }}" --first-publication "${{ inputs.first_publication }}" $flag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub prerelease (tag target = the candidate SHA)
        working-directory: candidate
        run: node ../tooling/scripts/create-github-release.mjs --mode prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ inputs.sha }}
