name: CI

# Single pipeline: quality checks on every push/PR, then deploy + release on push to main.
# Two Cloudflare Pages projects, both from this repo:
#   forge-cms       → apps/www              (landing + generic admin)
#   forge-cms-demo  → apps/demo-aesthetics  (the clinic demo the landing page links to)
# Releases: Changesets. `changeset-check` blocks PRs that touch packages/* without a changeset
# and exits successfully as a no-op on main pushes so release runs do not show a skipped check;
# `release` (push to main only) opens/updates a "Version Packages" PR when changesets are pending,
# and publishes to npm once that PR is merged (i.e. only when packages/* actually changed — a
# push to main with no pending changesets and no version bump is a no-op for this job). Needs the
# `NPM_TOKEN` repo secret (an npm Automation or Granular Access Token scoped to the `forge-cms` org
# with publish rights).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint · Typecheck · Test · Build · Pack · E2E
    runs-on: ubuntu-latest
    # Measured 2026-10-07: 13.5–14 min with the S03 journey inside this job. Spec 088 moved every packed
    # verifier (release:verify/compat/ssr, test:s3, test:upgrade) into the parallel `certify` job; 25 stays as
    # headroom for the remaining repository gates and app e2e suites (the job name is unchanged on purpose:
    # renaming a job silently detaches any branch-protection rule that requires it).
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build all packages and apps
        run: pnpm build

      # Snapshot of every published package's exported symbol names against api-baseline/*.json
      # (spec 058 §12) — catches an accidental removed/renamed export before it publishes. A real
      # public-surface change updates the baseline (`pnpm check:api:update`) in the same PR.
      - name: Check public API surface
        run: pnpm check:api

      # Real local Cloudflare Workers runtime (D1 + R2 via Miniflare/workerd) — no account, no
      # credentials, no remote resources. Kept as its own step (not folded into "Unit tests" above)
      # since it's slower and exercises a different pool; needs the build above for workspace
      # package resolution (@forge-cms/* imports resolve through dist/, per tsconfig.base.json).
      - name: Cloudflare runtime integration tests
        run: pnpm test:cloudflare

      # Real libSQL database (no Cloudflare binding at all) — the "Cloudflare-first, not
      # Cloudflare-locked" claim, proven rather than asserted (spec 058 §11 / roadmap B03: this was a
      # real suite that existed but was not release-gating).
      - name: libSQL portable-profile integration tests
        run: pnpm test:libsql

      # One install is enough: www, tiny-project and demo-aesthetics pin the same @playwright/test
      # version, so they share the browser cache. Filtering all three ran three `--with-deps`
      # installs in parallel and they raced for the apt lock (E: Could not get lock
      # /var/lib/apt/lists/lock). If the pins ever diverge, add a second, sequential step.
      - name: Install Playwright (chromium)
        run: pnpm --filter @forge-cms/www exec playwright install --with-deps chromium

      - name: E2E tests — apps/www
        run: pnpm e2e:www

      # Spec 075: the official site's production build under workerd (`wrangler pages dev`, local D1,
      # a per-run random AUTH_SECRET) — layout at 390/768/1440/1920, console, navigation, focus,
      # reduced motion, metadata and links. Uses the build from "Build all packages and apps".
      - name: E2E tests — apps/www production build
        run: pnpm e2e:www:prod

      # Real browser journeys the readiness/consumer suites already had but were not release-gating
      # (spec 058 §11 / roadmap B03) — a small external-style consumer (tiny-project) and the
      # real-world demo, both driven end to end, not just their unit tests.
      - name: E2E tests — apps/tiny-project
        run: pnpm e2e:tiny-project

      - name: E2E tests — apps/demo-aesthetics
        run: pnpm e2e:demo

  # Roadmap 0.12 / R01 (spec 088): the packed-artifact certification of this commit. One `pnpm release:certify` builds,
  # packs the eleven public packages ONCE (SHA-256 per tarball, `artifacts.json`), hands that exact set to every packed
  # verifier and seals it: the server-only + entry-point consumers (release:consumers), packed installation and
  # consumers (release:verify), the strict Angular/admin peer matrix incl. the /studio mount (release:compat), the
  # technical SSR/hydration consumer (release:ssr), the real-Garage durable evidence (test:s3: adapter · lifecycle ·
  # packed consumer · S3 recovery · Node+libSQL+S3 and workerd+D1+R2 production journeys) and the historical
  # upgrade/restore rehearsal (test:upgrade). Docker and Chromium are required — nothing is skipped. It is a separate job
  # so the slow certification runs in parallel with the fast repository gates; `release` needs BOTH, and there is no
  # path filter, so a package change can never publish without it.
  certify:
    name: Certify packed artifacts · durable profiles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: pnpm --filter @forge-cms/www exec playwright install --with-deps chromium

      - name: Certify the packed artifacts of this commit
        run: pnpm release:certify

      # The hashes, versions and per-stage outcomes are the reusable evidence for R02–R04 and L01. The tarballs stay
      # out of the artifact: it records WHICH bytes were certified, not a copy to install.
      - name: Upload the certification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-result
          path: |
            .certification/artifacts.json
            .certification/certification-result.json
          if-no-files-found: ignore

  # Roadmap 0.12 / R02 (spec 089): MEASURED reliability of this commit. Separate from `checks` (fast gates) and from
  # `certify` (which artifacts were built and certified): this job answers "how well tested, how stable, how
  # expensive". It runs per-package coverage against the 1.0 floors (pnpm test:coverage), the fixed performance
  # fixture with its frozen budgets and the production bundle sizes (pnpm test:performance), and repeated
  # first-attempt-only runs of the critical journeys (pnpm test:stability --profile ci). `release` needs it, and there
  # is no path filter: a package change can never publish without it. Retries are never used to hide a failure.
  reliability:
    name: Reliability · Coverage · Performance
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and apps
        run: pnpm build

      # One source-attributed V8 run per package (its own Vitest environment), merged per package, enforced per package
      # class (90/90/90/85 non-UI, 85/85/85/80 Angular runtime). Templates are certified by the rendered/browser suites,
      # not by this number.
      - name: Package-level coverage against the 1.0 floors
        run: pnpm test:coverage

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: |
            coverage/packages.json
            coverage/summary.md
            coverage/files.json
            coverage/uncovered.md
          if-no-files-found: ignore

      # Fixed on-disk libSQL fixture: database calls, latency distributions, memory, admin list rendering and the
      # production browser bundles of the packed consumers, judged against scripts/quality/performance-budgets.json.
      - name: Performance fixture and frozen budgets
        run: pnpm test:performance

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: |
            .quality/performance/summary.json
            .quality/performance/results.json
            .quality/performance/runtime.json
            .quality/performance/render.json
            .quality/performance/bundle.json
          if-no-files-found: ignore

      - name: Install Playwright (chromium)
        run: pnpm --filter @forge-cms/www exec playwright install --with-deps chromium

      # Critical journeys, repeated in fresh processes with retries OFF; every run's first-attempt result is recorded.
      - name: Stability of the critical journeys
        run: pnpm test:stability --profile ci

      - name: Upload stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-evidence
          path: |
            .quality/stability/results.json
            apps/*/test-results/**
          if-no-files-found: ignore

  changeset-check:
    name: Changeset required for packages/* changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip changeset check outside PRs
        if: github.event_name != 'pull_request'
        run: echo "Changeset checks are only required for pull requests."

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile

      # Fails if any package under packages/* changed since origin/main with no matching
      # .changeset/*.md file. Apps are `private: true`, so changes under apps/* never trigger this.
      - name: Verify a changeset exists
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main

  release:
    name: Release packages to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [checks, certify, reliability]
    # Same guard as deploy/deploy-demo: real pushes to main only, never PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # Depth 2: the GitHub release step compares HEAD's package versions with its first parent's and
      # tags only the commit that introduced the version (spec 072 §9).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # publishConfig.access is already "public" per package, but dist/ is gitignored — it must be
      # rebuilt here, or `changeset publish` would ship packages with no `dist/` at all.
      - name: Build all packages
        run: pnpm build

      - name: Verify packed package installation
        run: pnpm release:verify

      # No pending changesets and no version bump → this step is a no-op (nothing to publish).
      # Pending changesets → opens/updates a "Version Packages" PR instead of publishing.
      # That PR merged (versions bumped, changesets consumed) → publishes the bumped packages.
      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # changesets/action, when it opens/updates the "Version Packages" PR above, does so from a
      # throwaway `changeset-release/main` branch: it applies the version bump to the working tree
      # to compute that PR's diff, commits + pushes *that branch*, but never resets the checkout —
      # so package.json here can still read the bumped-but-not-yet-merged version even though `main`
      # itself is untouched. The two steps below must only ever publish/tag what is actually
      # committed to `main`, or they publish/tag a version whose bump never landed in git history.
      - name: Restore working tree to the triggering commit
        if: always()
        run: git checkout "${{ github.sha }}" -- .

      # The first public release started from an empty baseline changeset, so Changesets has no
      # version PR to consume. Publish only package versions that are still missing from npm; later
      # normal Changesets releases will publish first, and this step will skip already-published
      # versions.
      - name: Publish package versions missing from npm
        run: pnpm release:publish-unpublished
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub release
        run: pnpm release:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    # Deploy only on a real push to main — never on PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://forge-cms.pages.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build www
        run: pnpm build:www

      - name: Verify build output
        run: test -f apps/www/dist/analog/public/index.html

      # Preflight (spec 075): the build refuses to start without AUTH_SECRET (spec 069), so deploying
      # to a project that lacks it can only produce a 500. `pages secret list` prints secret *names*
      # only (never values); they are not printed, only the presence of the name is checked. If the
      # token cannot list them, the preflight warns instead of guessing.
      - name: Preflight — required Pages secret is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" -a -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare deploy credentials are not configured"; exit 1; }
          names=$(pnpm exec wrangler pages secret list --project-name=forge-cms 2>/dev/null) \
            || { echo "::warning::Could not list Pages secret names; the post-deploy health check stays authoritative."; exit 0; }
          grep -q -- '- AUTH_SECRET:' <<< "$names" \
            || { echo "::error::forge-cms has no production AUTH_SECRET — see docs/DEPLOYMENT-HEALTH.md"; exit 1; }

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages deploy apps/www/dist/analog/public
          --project-name=forge-cms
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=true

      # A Pages upload is not a successful deployment: the API must start (spec 075). Never weaken
      # this to hide a 500 — fix production (docs/DEPLOYMENT-HEALTH.md).
      - name: Verify the deployed official site is healthy
        run: node scripts/verify-deployment.mjs www

  deploy-demo:
    name: Deploy the demo app to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    # Same guard as `deploy`: real pushes to main only, never PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production-demo
      url: https://forge-cms-demo.pages.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the demo app
        run: pnpm build:demo

      - name: Verify build output
        run: test -f apps/demo-aesthetics/dist/analog/public/index.html

      - name: Preflight — required Pages secret is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" -a -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare deploy credentials are not configured"; exit 1; }
          names=$(pnpm exec wrangler pages secret list --project-name=forge-cms-demo 2>/dev/null) \
            || { echo "::warning::Could not list Pages secret names; the post-deploy health check stays authoritative."; exit 0; }
          grep -q -- '- AUTH_SECRET:' <<< "$names" \
            || { echo "::error::forge-cms-demo has no production AUTH_SECRET — see docs/DEPLOYMENT-HEALTH.md"; exit 1; }

      # Idempotent: the first run creates the project, later runs report it already exists.
      - name: Ensure the Pages project exists
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages project create forge-cms-demo
          --production-branch=main

      # `--cwd` picks up apps/demo-aesthetics/wrangler.toml, including its bindings; the directory
      # comes from that file's `pages_build_output_dir`.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages deploy
          --cwd apps/demo-aesthetics
          --project-name=forge-cms-demo
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=true

      - name: Verify the deployed demo is healthy
        run: node scripts/verify-deployment.mjs demo
