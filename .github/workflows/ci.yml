name: CI

# Single pipeline: quality checks on every push/PR, then deploy + release on push to main.
# Two Cloudflare Pages projects, both from this repo:
#   forge-cms       → apps/www              (landing + generic admin)
#   forge-cms-demo  → apps/demo-aesthetics  (the clinic demo the landing page links to)
# Releases: Changesets. `changeset-check` blocks PRs that touch packages/* without a changeset
# and exits successfully as a no-op on main pushes so release runs do not show a skipped check;
# `release` (push to main only) opens/updates a "Version Packages" PR when changesets are pending,
# and publishes to npm once that PR is merged (i.e. only when packages/* actually changed — a
# push to main with no pending changesets and no version bump is a no-op for this job). Needs the
# `NPM_TOKEN` repo secret (an npm Automation or Granular Access Token scoped to the `forge-cms` org
# with publish rights).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint · Typecheck · Test · Build · Pack · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build all packages and apps
        run: pnpm build

      # Real local Cloudflare Workers runtime (D1 + R2 via Miniflare/workerd) — no account, no
      # credentials, no remote resources. Kept as its own step (not folded into "Unit tests" above)
      # since it's slower and exercises a different pool; needs the build above for workspace
      # package resolution (@forge-cms/* imports resolve through dist/, per tsconfig.base.json).
      - name: Cloudflare runtime integration tests
        run: pnpm test:cloudflare

      - name: Verify packed package installation
        run: pnpm release:verify

      - name: Install Playwright (chromium)
        run: pnpm --filter @forge-cms/www exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm e2e:www

  changeset-check:
    name: Changeset required for packages/* changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip changeset check outside PRs
        if: github.event_name != 'pull_request'
        run: echo "Changeset checks are only required for pull requests."

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile

      # Fails if any package under packages/* changed since origin/main with no matching
      # .changeset/*.md file. Apps are `private: true`, so changes under apps/* never trigger this.
      - name: Verify a changeset exists
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main

  release:
    name: Release packages to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    # Same guard as deploy/deploy-demo: real pushes to main only, never PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # publishConfig.access is already "public" per package, but dist/ is gitignored — it must be
      # rebuilt here, or `changeset publish` would ship packages with no `dist/` at all.
      - name: Build all packages
        run: pnpm build

      - name: Verify packed package installation
        run: pnpm release:verify

      # No pending changesets and no version bump → this step is a no-op (nothing to publish).
      # Pending changesets → opens/updates a "Version Packages" PR instead of publishing.
      # That PR merged (versions bumped, changesets consumed) → publishes the bumped packages.
      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # changesets/action, when it opens/updates the "Version Packages" PR above, does so from a
      # throwaway `changeset-release/main` branch: it applies the version bump to the working tree
      # to compute that PR's diff, commits + pushes *that branch*, but never resets the checkout —
      # so package.json here can still read the bumped-but-not-yet-merged version even though `main`
      # itself is untouched. The two steps below must only ever publish/tag what is actually
      # committed to `main`, or they publish/tag a version whose bump never landed in git history.
      - name: Restore working tree to the triggering commit
        if: always()
        run: git checkout "${{ github.sha }}" -- .

      # The first public release started from an empty baseline changeset, so Changesets has no
      # version PR to consume. Publish only package versions that are still missing from npm; later
      # normal Changesets releases will publish first, and this step will skip already-published
      # versions.
      - name: Publish package versions missing from npm
        run: pnpm release:publish-unpublished
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub release
        run: pnpm release:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    # Deploy only on a real push to main — never on PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://forge-cms.pages.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build www
        run: pnpm build:www

      - name: Verify build output
        run: test -f apps/www/dist/analog/public/index.html

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages deploy apps/www/dist/analog/public
          --project-name=forge-cms
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=true

  deploy-demo:
    name: Deploy the demo app to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    # Same guard as `deploy`: real pushes to main only, never PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production-demo
      url: https://forge-cms-demo.pages.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the demo app
        run: pnpm build:demo

      - name: Verify build output
        run: test -f apps/demo-aesthetics/dist/analog/public/index.html

      # Idempotent: the first run creates the project, later runs report it already exists.
      - name: Ensure the Pages project exists
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages project create forge-cms-demo
          --production-branch=main

      # `--cwd` picks up apps/demo-aesthetics/wrangler.toml, including its bindings; the directory
      # comes from that file's `pages_build_output_dir`.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages deploy
          --cwd apps/demo-aesthetics
          --project-name=forge-cms-demo
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=true
