name: CI

# Single pipeline: quality checks on every push/PR, then deploy on push to main.
# Two Cloudflare Pages projects, both from this repo:
#   forge-cms       → apps/www              (landing + generic admin)
#   forge-cms-demo  → apps/demo-aesthetics  (the clinic demo the landing page links to)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint · Typecheck · Test · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build all packages and apps
        run: pnpm build

      - name: Install Playwright (chromium)
        run: pnpm --filter @forge-cms/www exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm e2e:www

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    # Deploy only on a real push to main — never on PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://forge-cms.pages.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build www
        run: pnpm build:www

      - name: Verify build output
        run: test -f apps/www/dist/analog/public/index.html

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages deploy apps/www/dist/analog/public
          --project-name=forge-cms
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=true

  deploy-demo:
    name: Deploy the demo app to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    # Same guard as `deploy`: real pushes to main only, never PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production-demo
      url: https://forge-cms-demo.pages.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the demo app
        run: pnpm build:demo

      - name: Verify build output
        run: test -f apps/demo-aesthetics/dist/analog/public/index.html

      # Idempotent: the first run creates the project, later runs report it already exists.
      - name: Ensure the Pages project exists
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages project create forge-cms-demo
          --production-branch=main

      # `--cwd` picks up apps/demo-aesthetics/wrangler.toml, including its bindings; the directory
      # comes from that file's `pages_build_output_dir`.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages deploy
          --cwd apps/demo-aesthetics
          --project-name=forge-cms-demo
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=true
